<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Exitoso - REDENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='confirmacion.css') }}">
</head>
<body>

    <div class="card">
        <h2>¡Registro Exitoso! 🎉</h2>
        <p style="color: #64748b; font-size: 14px;">Conserva tu código de paciente para agendar tus futuras citas.</p>

        <div class="info-row" style="background: #e0f2fe; padding: 12px; border-radius: 8px; text-align: center; border-bottom: none;">
            <span class="label" style="display: block; font-size: 13px; color: #0369a1;">Código de Paciente:</span> 
            <span class="value" style="font-size: 24px; font-weight: 800; color: #0284c7;">{{ codigo }}</span>
        </div>

        <div class="info-row"><span class="label">Paciente:</span> <span class="value">{{ nombre }}</span></div>
        <div class="info-row"><span class="label">Fecha de Nacimiento:</span> <span class="value">{{ fecha_nacimiento }}</span></div>

        {% if qr_code %}
        <div class="qr-section">
            <h3 style="color: #334155; font-size: 15px; margin-bottom: 8px;">Tu Código QR de Paciente</h3>
            <img src="data:image/png;base64,{{ qr_code }}" alt="Código QR Paciente">
        </div>
        {% endif %}

        <div class="button-group">
            <a href="{{ url_for('servicios') }}" class="btn-agendar">Agendar Cita Ahora</a>
            <a href="{{ url_for('inicio') }}" class="btn-home">Volver al Inicio</a>
        </div>
    </div>

</body>
</html>
