<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Exitoso - REDENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; display: flex; justify-content: center; padding: 40px 20px; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 480px; width: 100%; text-align: center; }
        h2 { color: #00a8ff; margin-top: 0; }
        .info-row { text-align: left; margin-bottom: 12px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        .label { font-weight: bold; color: #475569; }
        .value { color: #0f172a; }
        .qr-section { margin-top: 20px; margin-bottom: 20px; }
        .qr-section img { max-width: 180px; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; background: white; }
        .button-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .btn-home { padding: 12px 20px; background-color: #0f172a; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
        .btn-agendar { padding: 12px 20px; background-color: #00a8ff; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="card">
        <h2>¡Registro Exitoso! 🎉</h2>
        <p style="color: #64748b; font-size: 14px;">Conserva tu código de paciente para agendar tus futuras citas.</p>

        <div class="info-row" style="background: #e0f2fe; padding: 12px; border-radius: 8px; text-align: center; border-bottom: none;">
            <span class="label" style="display: block; font-size: 13px; color: #0369a1;">Código de Paciente:</span> 
            <span class="value" style="font-size: 24px; font-weight: 800; color: #0284c7;">{{ codigo }}</span>
        </div>

        <div class="info-row"><span class="label">Paciente:</span> <span class="value">{{ nombre }}</span></div>
        <div class="info-row"><span class="label">Fecha de Nacimiento:</span> <span class="value">{{ fecha_nacimiento }}</span></div>

        {% if qr_code %}
        <div class="qr-section">
            <h3 style="color: #334155; font-size: 15px; margin-bottom: 8px;">Tu Código QR de Paciente</h3>
            <img src="data:image/png;base64,{{ qr_code }}" alt="Código QR Paciente">
        </div>
        {% endif %}

        <div class="button-group">
            <a href="{{ url_for('agendar_cita_form') }}" class="btn-agendar">Agendar Cita Ahora</a>
            <a href="{{ url_for('inicio') }}" class="btn-home">Volver al Inicio</a>
        </div>
    </div>

</body>
</html>
